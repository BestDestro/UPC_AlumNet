# Feature B: rate limiting de los endpoints de autenticacion.
# Se incluye en el contexto "http" de nginx.conf.
# La clave del contador solo se rellena para las rutas sensibles; con clave vacia
# Nginx no cuenta la peticion, asi el limite se aplica al location de la API ya existente.
map $uri $rl_login_key {
    ~^/api/v1/auth/(login|mfa/login|mfa/setup-credentials|mfa/enable-credentials)/?$  $binary_remote_addr;
    default "";
}
map $uri $rl_register_key {
    ~^/api/v1/auth/register/?$  $binary_remote_addr;
    default "";
}
limit_req_zone $rl_login_key    zone=rl_login:10m    rate=10r/m;
limit_req_zone $rl_register_key zone=rl_register:10m rate=5r/m;
limit_req_status 429;
