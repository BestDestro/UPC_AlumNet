# Feature A: Content Security Policy y cabeceras de seguridad del frontend.
# Se incluye desde el bloque "location /" de nginx.conf (no afecta a /docs de Swagger).
# Un add_header dentro de un location anula los add_header heredados del server,
# por eso aqui se repiten HSTS, X-Frame-Options y X-Content-Type-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://api.qrserver.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
