# Feature B: respuesta 429 en JSON para los rechazos del rate limiting de Nginx.
# Se incluye dentro del bloque "server" de nginx.conf. El location de la API la activa con:
#     error_page 429 = @rate_limited;
# El texto coincide con el de la capa 3 (FastAPI, app/core/rate_limit.py) para que el
# frontend muestre el mismo mensaje en ambos casos.
# Sin add_header propio, esta respuesta hereda las cabeceras de seguridad del server.
# Solo afecta a rechazos generados por Nginx: los 429 de FastAPI no se interceptan
# (proxy_intercept_errors esta desactivado por defecto).
location @rate_limited {
    default_type application/json;
    return 429 '{"detail": "Too many requests. Try again later."}';
}
