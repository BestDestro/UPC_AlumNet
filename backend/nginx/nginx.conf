events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Rate limiting (feature B) ---
    # La clave solo se rellena para las rutas sensibles; con clave vacia Nginx no cuenta la peticion.
    map $uri $rl_login_key {
        ~^/api/v1/auth/(login|mfa/login|mfa/setup-credentials|mfa/enable-credentials)/?$  $binary_remote_addr;
        default "";
    }
    map $uri $rl_register_key {
        ~^/api/v1/auth/register/?$  $binary_remote_addr;
        default "";
    }
    limit_req_zone $rl_login_key    zone=rl_login:10m    rate=10r/m;
    limit_req_zone $rl_register_key zone=rl_register:10m rate=5r/m;
    limit_req_status 429;

    # Redirigir todo el tráfico HTTP (80) a HTTPS (443)
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }
    
    #-------------------------------------------------------------------------------------------------------------------------
    # Servidor seguro SSL/TLS
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES256-GCM-SHA384";
        
        # Cabecera HSTS para obligar a los navegadores a usar siempre HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        #-------------------------------------------------------------------------------------------------------------------------

        # Cabeceras de seguridad adicionales para superar auditorías de OWASP ZAP
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 1. Servir el Frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Content Security Policy (solo para el frontend; /docs de Swagger queda fuera)
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://api.qrserver.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

            # Repetidas: un add_header dentro de un location anula las del server
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 2. Redirigir peticiones de la API y Swagger UI a FastAPI
        location ~ ^/(api|docs|openapi.json|health) {
            # Rate limiting: solo cuenta las rutas que el map marca como sensibles
            limit_req zone=rl_login    burst=5 nodelay;
            limit_req zone=rl_register burst=3 nodelay;
            proxy_pass http://backend:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
